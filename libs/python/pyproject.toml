[tool.poetry]
name = "avbodh-tools"
version = "0.1.0"
description = "Shared tools and database clients for Avbodh AI Agents"
authors = [ "Avbodh <dev@avbodh.com>" ]

  [[tool.poetry.packages]]
  include = "chat_models"
  from = "src"

  [[tool.poetry.packages]]
  include = "embedding_models"
  from = "src"

  [[tool.poetry.packages]]
  include = "tools"
  from = "src"
  [tool.poetry.dependencies]
  python = "^3.10"
  PyMuPDF = "^1.23.0"
  redis = "^5.0.0"
  boto3 = "^1.34.0"
  langchain = "^1.3.15"
  langchain-huggingface = "^1.2.2"

[build-system]
requires = [ "poetry-core" ]
build-backend = "poetry.core.masonry.api"
